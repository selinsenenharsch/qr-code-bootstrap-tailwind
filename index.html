<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Component - Refactored</title>


  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body class="d-flex justify-content-center align-items-center min-vh-100 m-0" style="background-color: #d5e1ef;">


  <main class="container d-flex justify-content-center align-items-center">
    <div style="width: 320px;">

      <div class="card p-3 shadow-lg border-0 rounded-4 bg-white">


        <img src="./images/image-qr-code.png" class="card-img-top rounded-3 img-fluid" alt="QR Code to Frontend Mentor">


        <div class="card-body text-center px-3 pt-4 pb-3">
          <h1 class="fw-bold mb-3" style="color: #1f314f; font-size: 21px; letter-spacing: -0.5px;">
            Improve your front-end skills by building projects
          </h1>
          <p class="mb-0 px-2" style="color: #68778d; font-size: 15px; line-height: 1.4;">
            Scan the QR code to visit Frontend Mentor and take your coding skills to the next level
          </p>
        </div>

      </div>

    </div>
  </main>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
</body>

</html>
